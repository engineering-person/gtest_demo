name: CI Build & Test Artifact
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ libgtest-dev

      - name: Run build (test build)
        run: |
          chmod +x scripts/build.sh
          ./scripts/build.sh -DBUILD_TESTING=ON

      # 干净发布产物：不含测试代码和 gtest 依赖
      - name: Run build (release artifact)
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-release -j"$(nproc)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-output
          path: build-release/
          retention-days: 7

      # 仅供 LLT 使用的测试构建，不作为发布产物
      - name: Upload test build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-build-output
          path: build/
          retention-days: 7

  test:
    needs: build  # 必须等 build job 成功之后，才会执行 test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y cmake g++ libgtest-dev

      # 下载测试构建（非发布产物）
      - name: Download test build artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-build-output
          path: build/

      - name: Run unit test
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh
